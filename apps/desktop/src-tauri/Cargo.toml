[package]
name = "xlabel"
version = "0.1.0"
description = "离线 AI 标注训练桌面软件"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "xlabel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "rayon"] }
rayon = "1"
blake3 = "1"
thiserror = "2"
walkdir = "2"
parking_lot = "0.12"
roxmltree = "0.20"
ureq = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev.package."*"]
# 依赖库用优化编译，开发时图片解码不至于太慢
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
