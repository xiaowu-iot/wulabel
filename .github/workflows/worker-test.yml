# worker（训练、推理、导出）的自动测试：CPU 上跑指标单元测试和 YOLOX 冒烟测试。
name: worker-test

on:
  push:
    paths: ["worker/**", ".github/workflows/worker-test.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 安装依赖（CPU 版 PyTorch）
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pillow onnx onnxruntime opencv-python-headless
          # Ultralytics：测 YOLOv8 / 11 的导出格式和训练引擎；装完换回 headless 版 OpenCV，避免两个 cv2 冲突
          pip install ultralytics
          pip uninstall -y opencv-python || true
          pip install --force-reinstall --no-deps opencv-python-headless

      - name: 运行测试
        working-directory: worker
        shell: bash
        run: |
          set -o pipefail
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
          status=$?
          set -e
          {
            echo '### 测试结果'
            echo '```'
            grep -E '\.\.\. |^Ran |^OK|^FAILED|已加载|mAP50|最后 [0-9]+ 轮|onnxruntime' test-output.txt | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 运行页面上直接能看到的一行结果
          echo "::notice title=测试结果::$(grep -E '^Ran |^OK|^FAILED' test-output.txt | tr '\n' ' ') $(grep -cE '\.\.\. ok$' test-output.txt) 项通过"
          echo "::notice title=YOLOX 冒烟测试::$(grep -oE 'test_[a-z_]+ \([^)]*\) \.\.\. [a-z]+' test-output.txt | tr '\n' '；')"
          # 失败时把出错的测试和报错写成注释，不登录也能在运行页面看到
          if [ "$status" -ne 0 ]; then
            grep -E '^(ERROR|FAIL):' test-output.txt | while read -r l; do echo "::error title=失败的测试::$l"; done
            grep -A 25 -E '^(ERROR|FAIL):' test-output.txt | grep -E 'File "|Error|assert|^[A-Za-z]+:' | tail -20 | while read -r l; do echo "::error title=报错::$l"; done
          fi
          exit "$status"
