# 测试打包：只打安装包，不发 Release。打好的包在这次运行页面最下面的 Artifacts 里下载，保留 7 天。
# 触发：在 GitHub 的 Actions 页面选 build → Run workflow。正式发版用 release.yml。

name: build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ""
            rust_targets: ""
            bundle: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            name: macos
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            bundle: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    environment: WULABEL_FEEDBACK_SECRET
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: 安装前端依赖
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      - name: 打包
        uses: tauri-apps/tauri-action@v0
        env:
          WULABEL_FEEDBACK_SECRET: ${{ secrets.WULABEL_FEEDBACK_SECRET }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: wulabel-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.bundle }}
          retention-days: 7
          if-no-files-found: error
