# 打安装包：Windows（.exe）和 macOS（.dmg，Apple 芯片和 Intel 通用）。
# 触发：推送 v 开头的标签（如 v0.2.0），或在 GitHub 的 Actions 页面手动运行。
# 打好的包放进一个「草稿」Release，检查没问题后在 GitHub 上点发布。
# 反馈服务的密钥放在仓库 Settings → Environments → WULABEL_FEEDBACK_SECRET 里，secret 名也叫 WULABEL_FEEDBACK_SECRET。

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            rust_targets: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    # 反馈密钥存在这个 Environment 的 secrets 里
    environment: WULABEL_FEEDBACK_SECRET
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: 安装前端依赖
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      - name: 打包并上传到草稿 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WULABEL_FEEDBACK_SECRET: ${{ secrets.WULABEL_FEEDBACK_SECRET }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: Wulabel v__VERSION__
          releaseBody: 下载说明见官网 https://wulabel.xiaowuiot.com
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
