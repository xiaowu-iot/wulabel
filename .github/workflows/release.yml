# 打安装包：Windows（.exe）、macOS（.dmg，Apple 芯片和 Intel 通用）、Linux x86_64 和 ARM64（.AppImage 和 .deb）。
# 触发：推送 v 开头的标签（如 v0.2.0），或在 GitHub 的 Actions 页面手动运行。
# 打好的包放进一个「草稿」Release，检查没问题后在 GitHub 上点发布。
# 反馈服务的密钥放在仓库 Settings → Environments → WULABEL_FEEDBACK_SECRET 里，secret 名也叫 WULABEL_FEEDBACK_SECRET。

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            rust_targets: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - os: ubuntu-22.04
            args: ""
            rust_targets: ""
          # ARM64 Linux（飞腾、鲲鹏等）
          - os: ubuntu-22.04-arm
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    # 反馈密钥存在这个 Environment 的 secrets 里
    environment: WULABEL_FEEDBACK_SECRET
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Linux 编译依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: 安装前端依赖
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      - name: 打包并上传到草稿 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WULABEL_FEEDBACK_SECRET: ${{ secrets.WULABEL_FEEDBACK_SECRET }}
          # 全自动更新的签名私钥（和 tauri.conf.json 里的 pubkey 是一对），放在同一个 Environment 的 secrets 里
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: Wulabel v__VERSION__
          releaseBody: 下载说明见官网 https://wulabel.xiaowuiot.com
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # 安装包同时传一份到 Gitee 发行版：国内下载快，软件自动更新时会测一下 Gitee、GitHub、官网哪个快就从哪个下。
  # 需要在同一个 Environment 的 secrets 里加 GITEE_TOKEN（Gitee「设置 → 私人令牌」，勾 projects 权限）；没加就跳过。
  # 等 Gitee 镜像同步到这个标签再建发行版（最多等 15 分钟）；已经有的同名附件不重复传。出错不影响 GitHub 那边。
  gitee:
    needs: build
    runs-on: ubuntu-22.04
    environment: WULABEL_FEEDBACK_SECRET
    continue-on-error: true
    steps:
      - name: 安装包传到 Gitee 发行版
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          REPO: ${{ github.repository }}
          GITEE_REPO: xiaowu-iot/wulabel
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN}" ]; then echo "没有配置 GITEE_TOKEN，跳过"; exit 0; fi
          # 找这次打包的草稿 Release（草稿没有正式标签，按名字找最新一个）
          REL=$(gh api "repos/$REPO/releases?per_page=10" --jq '[.[] | select(.name | startswith("Wulabel v"))][0]')
          TAG=$(echo "$REL" | jq -r '.tag_name')
          NAME=$(echo "$REL" | jq -r '.name')
          echo "版本 $TAG"
          mkdir -p assets
          echo "$REL" | jq -r '.assets[] | select(.name | (endswith(".sig") or . == "latest.json") | not) | "\(.id) \(.name)"' |
            while read -r ID FILE; do
              gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$ID" > "assets/$FILE"
              echo "下载 $FILE $(stat -c %s "assets/$FILE")"
            done
          API=https://gitee.com/api/v5/repos/$GITEE_REPO
          # 等镜像把标签同步过去
          for i in $(seq 1 30); do
            if curl -sf "$API/tags?access_token=$GITEE_TOKEN&per_page=100" | jq -e --arg t "$TAG" 'map(.name) | index($t)' >/dev/null; then break; fi
            echo "Gitee 还没有标签 $TAG，30 秒后再看"; sleep 30
          done
          RID=$(curl -sf "$API/releases/tags/$TAG?access_token=$GITEE_TOKEN" | jq -r '.id // empty' || true)
          if [ -z "$RID" ]; then
            RID=$(curl -sf -X POST "$API/releases" \
              --form-string "access_token=$GITEE_TOKEN" --form-string "tag_name=$TAG" --form-string "name=$NAME" \
              --form-string "body=下载说明见官网 https://wulabel.xiaowuiot.com" --form-string "target_commitish=main" | jq -r '.id')
          fi
          echo "Gitee 发行版 $RID"
          HAVE=$(curl -sf "$API/releases/$RID/attach_files?access_token=$GITEE_TOKEN&per_page=100" | jq -r '.[].name' || true)
          for f in assets/*; do
            n=$(basename "$f")
            if echo "$HAVE" | grep -qxF "$n"; then echo "已有 $n"; continue; fi
            curl -sf -X POST "$API/releases/$RID/attach_files" --form-string "access_token=$GITEE_TOKEN" -F "file=@$f" >/dev/null \
              && echo "已传 $n" || echo "::warning::$n 传到 Gitee 失败"
          done
